apiVersion: apps/v1
kind: Deployment
metadata:
  name: gews-dashboard
  namespace: gews
  labels:
    app.kubernetes.io/name: gews
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gews
      app.kubernetes.io/component: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gews
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/gews-project/gews:latest  # replace with your registry
          command: ["gews", "dashboard"]
          args:
            - "-c"
            - "$(GEWS_CONFIG)"
            - "--port"
            - "$(GEWS_DASHBOARD_PORT)"
            - "--data-dir"
            - "/app/output"
          envFrom:
            - configMapRef:
                name: gews-config
            - secretRef:
                name: gews-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: gews-output
              mountPath: /app/output
              readOnly: true
            - name: gews-config-vol
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: gews-output
          persistentVolumeClaim:
            claimName: gews-output
        - name: gews-config-vol
          configMap:
            name: gews-site-config  # holds global_watch.yaml; create separately
