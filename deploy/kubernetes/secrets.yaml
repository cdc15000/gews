# WARNING: Replace all CHANGEME values before deploying.
# In production, use an external secrets manager (e.g. AWS Secrets Manager,
# HashiCorp Vault, or Sealed Secrets) instead of storing secrets in this file.
#
# Base64-encode values:  echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: gews-secrets
  namespace: gews
  labels:
    app.kubernetes.io/name: gews
    app.kubernetes.io/part-of: gews
type: Opaque
data:
  # Earthdata credentials for InSAR data access
  EARTHDATA_USER: Q0hBTkdFTUU=          # CHANGEME
  EARTHDATA_PASS: Q0hBTkdFTUU=          # CHANGEME
  # SMTP credentials for email alerts
  GEWS_SMTP_HOST: Q0hBTkdFTUU=          # CHANGEME
  GEWS_SMTP_USER: Q0hBTkdFTUU=          # CHANGEME
  GEWS_SMTP_PASS: Q0hBTkdFTUU=          # CHANGEME
  GEWS_SMTP_TO: Q0hBTkdFTUU=            # CHANGEME
  # Slack incoming webhook URL
  GEWS_SLACK_WEBHOOK: Q0hBTkdFTUU=      # CHANGEME
  # Generic webhook URL
  GEWS_WEBHOOK_URL: Q0hBTkdFTUU=        # CHANGEME
