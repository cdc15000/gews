# Prometheus alerting rules for GEWS
groups:
  - name: gews.pipeline
    rules:
      # Pipeline failure — monitor job exited with an error
      - alert: GEWSPipelineFailure
        expr: |
          gews_monitor_last_exit_code != 0
        for: 5m
        labels:
          severity: critical
          component: monitor
        annotations:
          summary: "GEWS monitor pipeline failed"
          description: >-
            The most recent GEWS monitor run exited with code
            {{ $value }}. Check container logs for details.

      # Stale data — no successful run in the last 36 hours
      - alert: GEWSStaleData
        expr: |
          time() - gews_monitor_last_success_timestamp_seconds > 36 * 3600
        for: 10m
        labels:
          severity: warning
          component: monitor
        annotations:
          summary: "GEWS data is stale (>36 h since last successful run)"
          description: >-
            No successful monitor run has completed in
            {{ $value | humanizeDuration }}. The pipeline may be stuck
            or the CronJob/scheduled task may have stopped firing.

      # Flag spike — unusually high number of new flags in a single run
      - alert: GEWSFlagSpike
        expr: |
          increase(gews_flags_raised_total[6h]) > 10
        for: 0m
        labels:
          severity: warning
          component: monitor
        annotations:
          summary: "Spike in GEWS detection flags"
          description: >-
            {{ $value }} new flags were raised in the last 6 hours,
            which exceeds the expected baseline. Review the dashboard
            for possible widespread displacement events.

  - name: gews.dashboard
    rules:
      # Dashboard down
      - alert: GEWSDashboardDown
        expr: up{job="gews-dashboard"} == 0
        for: 5m
        labels:
          severity: critical
          component: dashboard
        annotations:
          summary: "GEWS dashboard is unreachable"
          description: >-
            Prometheus cannot scrape the GEWS dashboard at
            {{ $labels.instance }}. The service may be down or
            the network path is broken.

      # High request latency
      - alert: GEWSDashboardHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(gews_dashboard_request_duration_seconds_bucket[5m])
          ) > 2
        for: 10m
        labels:
          severity: warning
          component: dashboard
        annotations:
          summary: "GEWS dashboard p95 latency > 2 s"
          description: >-
            The 95th-percentile response time is {{ $value | humanize }}s.
            The dashboard may be under heavy load or the output volume
            is slow.
