# Prometheus scrape configuration for GEWS
# Add this to your prometheus.yml or mount as a separate scrape config file.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "alertmanager-rules.yaml"

scrape_configs:
  # GEWS dashboard metrics endpoint
  - job_name: "gews-dashboard"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["gews-dashboard:8080"]
        labels:
          app: gews
          component: dashboard

    # For Kubernetes service discovery, replace static_configs above:
    # kubernetes_sd_configs:
    #   - role: endpoints
    #     namespaces:
    #       names: ["gews"]
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_service_name]
    #     regex: gews-dashboard
    #     action: keep
    #   - source_labels: [__meta_kubernetes_namespace]
    #     target_label: namespace
    #   - source_labels: [__meta_kubernetes_pod_name]
    #     target_label: pod

  # GEWS monitor CronJob metrics (push gateway or job-level metrics)
  - job_name: "gews-monitor"
    metrics_path: /metrics
    scrape_interval: 60s
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          app: gews
          component: monitor
